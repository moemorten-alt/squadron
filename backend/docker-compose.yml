services:
  postgres:
    image: postgres:16-alpine
    container_name: squadron-postgres
    environment:
      POSTGRES_DB: squadron
      POSTGRES_USER: squadron
      POSTGRES_PASSWORD: squadron
    ports:
      - "5432:5432"
    volumes:
      - squadron-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadron"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  squadron-pgdata:
