spring:
  datasource:
    url: jdbc:h2:file:./data/squadron;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true   # Hibernate schema first, then data.sql

  flyway:
    enabled: false

  sql:
    init:
      mode: never   # LocalDataInitializer handles seeding via ResourceDatabasePopulator

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.squadron: DEBUG
    org.hibernate.SQL: DEBUG
