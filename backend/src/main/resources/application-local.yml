spring:
  datasource:
    url: jdbc:h2:file:./data/squadron;${squadron.h2.compat-params};AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Hibernate's auto-detection picks the wrong dialect when MODE=PostgreSQL is
        # in the JDBC URL (generates unsupported "insert ... returning id" syntax
        # against H2), so this must stay explicit despite the deprecation warning.
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true   # Hibernate schema first, then data.sql

  flyway:
    enabled: false

  sql:
    init:
      mode: never   # LocalDataInitializer handles seeding via ResourceDatabasePopulator

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.squadron: DEBUG
    org.hibernate.SQL: DEBUG
