# Shared across the H2-based profiles (local, test) so they don't each hardcode
# their own copy of the H2-as-Postgres compatibility flags.
squadron:
  h2:
    compat-params: MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

spring:
  application:
    name: squadron-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/squadron}
    username: ${DB_USER:squadron}
    password: ${DB_PASSWORD:squadron}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    # Override with a strong random base64-encoded 256-bit key in production via JWT_SECRET env var
    secret: ${JWT_SECRET:c3F1YWRyb25TZWNyZXRLZXlGb3JEZXZPbmx5LU5vdEZvclByb2R1Y3Rpb24h}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000}  # 30 days

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.squadron: DEBUG
    org.flywaydb: INFO
