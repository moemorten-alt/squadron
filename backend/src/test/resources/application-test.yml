spring:
  datasource:
    url: jdbc:h2:mem:squadron-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  sql:
    init:
      mode: never

security:
  jwt:
    secret: dGVzdE9ubHlTZWNyZXRLZXlGb3JTcHJpbmdCb290VGVzdHNOb3RSZWFs
    expiration-ms: 60000

logging:
  level:
    com.squadron: WARN
    org.hibernate.SQL: WARN
